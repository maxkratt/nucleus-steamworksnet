    <linearGradient id="glint" x1="0" x2="1"><stop stop-color="#66c0f4" stop-opacity="0"/><stop offset=".5" stop-color="#66c0f4"/><stop offset="1" stop-color="#66c0f4" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="800" height="160" fill="url(#bg)"/>
  <g font-family="Segoe UI, system-ui, Arial, sans-serif">
